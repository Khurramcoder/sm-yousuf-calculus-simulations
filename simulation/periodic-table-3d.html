<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Periodic Table — Spectral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#080a0f;
  --bg-deep:#040507;
  --panel:#0e131b;
  --panel-2:#131a24;
  --border:#1d2530;
  --text:#e9edf2;
  --text-dim:#8b96a5;
  --text-faint:#4d5866;
  --cyan:#4ce0d2;
  --amber:#f2a65a;
  --alkali:#ff6b6b;
  --alkaline:#ffa94d;
  --transition:#4dabf7;
  --post:#63e6be;
  --metalloid:#b197fc;
  --nonmetal:#69db7c;
  --halogen:#ffd43b;
  --noble:#e599f7;
  --lanth:#74c0fc;
  --actin:#ff8787;
  --marker:#3a4250;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%; height:100%; overflow:hidden; background:var(--bg); font-family:'Manrope',sans-serif; color:var(--text);}
#app{position:relative; width:100vw; height:100vh;}
#canvas-container{position:absolute; inset:0;}
#canvas-container canvas{display:block; touch-action:none; cursor:grab;}
#canvas-container.dragging canvas{cursor:grabbing;}

/* ---------- background texture ---------- */
#bg-glow{position:absolute; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 900px 500px at 18% 8%, rgba(76,224,210,0.07), transparent 60%),
    radial-gradient(ellipse 700px 500px at 85% 90%, rgba(242,166,90,0.06), transparent 60%);
}

/* ---------- header ---------- */
header{
  position:absolute; top:0; left:0; right:0; z-index:10;
  padding:22px 28px 14px;
  background:linear-gradient(180deg, rgba(6,8,12,0.92) 0%, rgba(6,8,12,0.55) 70%, transparent 100%);
  pointer-events:none;
}
header > *{pointer-events:auto;}
.title-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
h1{
  font-family:'Space Mono', monospace; font-weight:700; letter-spacing:0.5px;
  font-size:22px; color:var(--text);
}
h1 span{color:var(--cyan);}
.subtitle{font-size:12.5px; color:var(--text-dim); letter-spacing:0.3px;}
.controls-row{display:flex; align-items:center; gap:14px; margin-top:14px; flex-wrap:wrap;}
#search{
  background:var(--panel); border:1px solid var(--border); color:var(--text);
  padding:9px 14px; border-radius:8px; font-family:'Manrope'; font-size:13px;
  width:200px; outline:none; transition:border-color .15s;
}
#search::placeholder{color:var(--text-faint);}
#search:focus{border-color:var(--cyan);}
#legend{display:flex; gap:7px; flex-wrap:wrap; max-width:640px;}
.chip{
  display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px;
  background:var(--panel); border:1px solid var(--border); cursor:pointer;
  font-size:11px; color:var(--text-dim); transition:all .15s; user-select:none;
  font-family:'Manrope'; font-weight:600;
}
.chip:hover{border-color:var(--text-faint); color:var(--text);}
.chip.active{background:var(--panel-2); color:var(--text); border-color:currentColor;}
.chip .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
#reset-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-dim);
  padding:8px 14px; border-radius:8px; font-size:11px; cursor:pointer; font-family:'Manrope'; font-weight:600;
  transition:all .15s; letter-spacing:0.3px;
}
#reset-btn:hover{border-color:var(--cyan); color:var(--cyan);}

/* ---------- hint ---------- */
#hint{
  position:absolute; bottom:18px; left:28px; z-index:5;
  font-size:11px; color:var(--text-faint); font-family:'Space Mono', monospace;
  letter-spacing:0.4px; pointer-events:none;
  transition:opacity .4s;
}

/* ---------- legend value bar bottom right ---------- */
#count-badge{
  position:absolute; bottom:18px; right:28px; z-index:5;
  font-family:'Space Mono', monospace; font-size:11px; color:var(--text-faint);
  letter-spacing:0.3px;
}
#count-badge b{color:var(--cyan); font-weight:700;}

/* ---------- tooltip ---------- */
#tooltip{
  position:absolute; z-index:20; pointer-events:none;
  background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
  padding:8px 12px; font-family:'Space Mono', monospace; font-size:12px;
  white-space:nowrap; transform:translate(-50%,-130%); opacity:0; transition:opacity .12s;
  box-shadow:0 8px 24px rgba(0,0,0,0.5);
}
#tooltip.show{opacity:1;}
#tooltip .t-name{color:var(--text); font-weight:700; font-family:'Manrope'; font-size:12.5px;}
#tooltip .t-sub{color:var(--text-dim); font-size:10.5px; margin-top:2px;}

/* ---------- detail panel ---------- */
#detail-panel{
  position:absolute; top:0; right:0; bottom:0; width:400px; max-width:92vw; z-index:30;
  background:var(--panel); border-left:1px solid var(--border);
  transform:translateX(100%); transition:transform .38s cubic-bezier(.16,.84,.44,1);
  overflow-y:auto; box-shadow:-30px 0 60px rgba(0,0,0,0.4);
}
#detail-panel.open{transform:translateX(0);}
#detail-panel::-webkit-scrollbar{width:8px;}
#detail-panel::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
.panel-close{
  position:absolute; top:18px; right:18px; width:32px; height:32px; border-radius:50%;
  background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  transition:all .15s; z-index:2;
}
.panel-close:hover{color:var(--text); border-color:var(--cyan);}
.panel-hero{
  padding:44px 28px 24px; position:relative; overflow:hidden;
}
.panel-hero::before{
  content:''; position:absolute; inset:0; opacity:0.14;
  background:radial-gradient(circle at 30% 20%, var(--cat-color, var(--cyan)), transparent 65%);
}
.hero-num{font-family:'Space Mono'; font-size:13px; color:var(--text-dim); letter-spacing:1px; position:relative;}
.hero-symbol{
  font-family:'Space Mono'; font-weight:700; font-size:64px; line-height:1; margin:6px 0 2px;
  color:var(--cat-color, var(--cyan)); position:relative; text-shadow:0 0 30px color-mix(in srgb, var(--cat-color) 50%, transparent);
}
.hero-name{font-size:24px; font-weight:800; position:relative;}
.hero-mass{font-family:'Space Mono'; font-size:13px; color:var(--text-dim); margin-top:4px; position:relative;}
.hero-badge{
  display:inline-block; margin-top:12px; padding:5px 12px; border-radius:20px; font-size:11px;
  font-weight:700; letter-spacing:0.4px; text-transform:uppercase; position:relative;
  background:color-mix(in srgb, var(--cat-color) 18%, transparent); color:var(--cat-color, var(--cyan));
  border:1px solid color-mix(in srgb, var(--cat-color) 40%, transparent);
}
.panel-body{padding:4px 28px 40px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:22px;}
.stat{background:var(--panel); padding:12px 14px;}
.stat-label{font-size:9.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-faint); font-weight:700;}
.stat-value{font-family:'Space Mono'; font-size:14px; margin-top:4px; color:var(--text);}
.section-label{font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--cat-color, var(--cyan)); font-weight:700; margin:22px 0 8px;}
.panel-text{font-size:14px; line-height:1.65; color:#c7cfd9;}
.config-box{
  font-family:'Space Mono'; font-size:13px; background:var(--panel-2); border:1px solid var(--border);
  border-radius:8px; padding:12px 14px; color:var(--cyan); letter-spacing:0.5px; word-break:break-word;
}

@media (max-width:640px){
  header{padding:16px 16px 10px;}
  h1{font-size:18px;}
  #legend{max-width:100%;}
  #search{width:140px;}
  #detail-panel{width:100%;}
  #hint{left:16px; font-size:10px;}
  #count-badge{right:16px;}
}
</style>
</head>

/* =========================================================================
   LAYOUT: compute 3D grid position for each element
   ========================================================================= */
const SPACING = 1.06;
function gridPos(period, group){
  const x = (group - 9.5) * SPACING;
  let y;
  if(period <= 7){
    y = (4 - period) * SPACING;
  } else if(period === 9){ // lanthanide row
    y = (4 - 7) * SPACING - 1.7*SPACING;
  } else { // period 10, actinide row
    y = (4 - 7) * SPACING - 1.7*SPACING - 1.08*SPACING;
  }
  return {x, y};
}
RAW.forEach(el=>{
  const p = gridPos(el.period, el.group);
  el.x = p.x; el.y = p.y;
});
// marker placeholder cells for the f-block gap

];

   THREE.JS SCENE
   ========================================================================= */
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, container.clientWidth/container.clientHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8899aa, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(8, 12, 10);
scene.add(keyLight);
const rimLight = new THREE.PointLight(0x4ce0d2, 0.6, 60);
rimLight.position.set(-10, -6, 8);
scene.add(rimLight);
const rimLight2 = new THREE.PointLight(0xf2a65a, 0.4, 60);
rimLight2.position.set(10, 8, -6);
scene.add(rimLight2);

// subtle starfield backdrop
(function starfield(){
  const geo = new THREE.BufferGeometry();
  const N = 500, pos = new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3] = (Math.random()-0.5)*160;
    pos[i*3+1] = (Math.random()-0.5)*160;
    pos[i*3+2] = -40 - Math.random()*60;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({color:0x2a3444, size:0.5, sizeAttenuation:true});
  scene.add(new THREE.Points(geo, mat));
})();

function makeTileTexture(el){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = CATS[el.cat] ? CATS[el.cat].color : '#3a4250';
  ctx.fillRect(0,0,256,256);
  // subtle inner shade
  const grad = ctx.createLinearGradient(0,0,0,256);
  grad.addColorStop(0,'rgba(255,255,255,0.18)');
  grad.addColorStop(1,'rgba(0,0,0,0.18)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,256,256);
  ctx.fillStyle = 'rgba(10,12,16,0.92)';
  ctx.font = '700 30px "Space Mono", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(el.z, 16, 40);
  ctx.textAlign = 'center';
  ctx.font = '700 96px "Space Mono", monospace';
  ctx.fillText(el.sym, 128, 158);
  ctx.font = '600 20px "Manrope", sans-serif';
  const nm = el.name.length > 11 ? el.name.slice(0,10)+'…' : el.name;
  ctx.fillText(nm, 128, 200);
  ctx.font = '400 16px "Space Mono", monospace';
  ctx.fillText(el.mass, 128, 228);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

const tileGroup = new THREE.Group();
scene.add(tileGroup);
const TILE_SIZE = 0.92, TILE_DEPTH = 0.16;

RAW.forEach(el=>{
  const geo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_DEPTH);
  const baseColor = new THREE.Color(CATS[el.cat] ? CATS[el.cat].color : '#3a4250');
  const sideMat = new THREE.MeshStandardMaterial({color: baseColor.clone().multiplyScalar(0.55), roughness:0.6, metalness:0.15});
  const faceTex = makeTileTexture(el);
  const faceMat = new THREE.MeshStandardMaterial({map: faceTex, roughness:0.5, metalness:0.1, emissive: baseColor, emissiveIntensity:0.08});
  const backMat = new THREE.MeshStandardMaterial({color: baseColor.clone().multiplyScalar(0.4), roughness:0.7});
  // order: +x -x +y -y +z -z
  const mats = [sideMat, sideMat, sideMat, sideMat, faceMat, backMat];
  const mesh = new THREE.Mesh(geo, mats);
  mesh.position.set(el.x, el.y, 0);
  mesh.userData = {el, baseColor, baseZ:0, hovered:false, selected:false};
  tileGroup.add(mesh);
  el.mesh = mesh;
});

// marker placeholders (non-interactive)
MARKERS.forEach(m=>{
  const geo = new THREE.BoxGeometry(TILE_SIZE, TILE_SIZE, TILE_DEPTH*0.6);
  const mat = new THREE.MeshStandardMaterial({color:0x232b36, roughness:0.9});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(m.x, m.y, -0.02);
  tileGroup.add(mesh);
});

// center whole group vertically for nicer framing
const box = new THREE.Box3().setFromObject(tileGroup);
const center = box.getCenter(new THREE.Vector3());
tileGroup.position.x -= center.x;
tileGroup.position.y -= center.y;

/* =========================================================================
   CUSTOM ORBIT CAMERA (no external controls dependency)
   ========================================================================= */
let radius = 24, theta = 0.15, phi = 1.05;
const DEFAULT_CAM = {radius:24, theta:0.15, phi:1.05};
let targetRadius = radius, targetTheta = theta, targetPhi = phi;
let isDragging = false, lastX=0, lastY=0;
let lastInteraction = Date.now();
let autoRotate = true;

function updateCamera(){
  camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
  camera.position.y = radius * Math.cos(phi);
  camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
  camera.lookAt(0,0,0);
}
updateCamera();

container.addEventListener('pointerdown', e=>{
  isDragging = true; lastX = e.clientX; lastY = e.clientY;
  container.classList.add('dragging');
  autoRotate = false; lastInteraction = Date.now();
});
window.addEventListener('pointerup', ()=>{ isDragging = false; container.classList.remove('dragging'); });
window.addEventListener('pointermove', e=>{
  if(isDragging){
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    targetTheta -= dx * 0.0055;
    targetPhi = Math.min(Math.max(targetPhi - dy * 0.0055, 0.35), Math.PI - 0.35);
    lastInteraction = Date.now();
  }
  handleHover(e);
});
container.addEventListener('wheel', e=>{
  e.preventDefault();
  targetRadius = Math.min(Math.max(targetRadius + e.deltaY * 0.02, 8), 55);
  lastInteraction = Date.now(); autoRotate = false;
}, {passive:false});

// touch pinch zoom
let pinchDist = null;
container.addEventListener('touchmove', e=>{
  if(e.touches.length === 2){
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if(pinchDist!==null){
      targetRadius = Math.min(Math.max(targetRadius - (d-pinchDist)*0.05, 8), 55);
    }
    pinchDist = d; autoRotate=false; lastInteraction=Date.now();
  }
}, {passive:true});
container.addEventListener('touchend', ()=>{ pinchDist = null; });

document.getElementById('reset-btn').addEventListener('click', ()=>{
  targetRadius = DEFAULT_CAM.radius; targetTheta = DEFAULT_CAM.theta; targetPhi = DEFAULT_CAM.phi;
  autoRotate = true; lastInteraction = Date.now();
  closePanel();
  clearFilters();
});

/* =========================================================================
   RAYCASTING: hover + click
   ========================================================================= */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hoveredMesh = null, selectedMesh = null;

function handleHover(e){
  const rect = container.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(tileGroup.children);
  const hit = hits.find(h => h.object.userData && h.object.userData.el);
  if(hit){
    if(hoveredMesh !== hit.object){
      if(hoveredMesh && hoveredMesh !== selectedMesh) setHoverState(hoveredMesh, false);
      hoveredMesh = hit.object;
      setHoverState(hoveredMesh, true);
    }
    const el = hit.object.userData.el;
    tooltip.querySelector('.t-name').textContent = el.name + ' (' + el.sym + ')';
    tooltip.querySelector('.t-sub').textContent = '#' + el.z + ' · ' + (CATS[el.cat]?CATS[el.cat].label:'Unknown') + ' · ' + el.mass;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.classList.add('show');
    container.style.cursor = 'pointer';
  } else {
    if(hoveredMesh && hoveredMesh !== selectedMesh) setHoverState(hoveredMesh, false);
    hoveredMesh = null;
    tooltip.classList.remove('show');
    container.style.cursor = isDragging ? 'grabbing' : 'grab';
  }
}
function setHoverState(mesh, on){
  mesh.userData.hovered = on;
}

container.addEventListener('click', e=>{
  if(Math.abs(e.clientX-lastX)>4 || Math.abs(e.clientY-lastY)>4){ /* was a drag */ }
  const rect = container.getBoundingClientRect();
  mouse.x = ((e.clientX-rect.left)/rect.width)*2 - 1;
  mouse.y = -((e.clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(tileGroup.children);
  const hit = hits.find(h => h.object.userData && h.object.userData.el);
  if(hit){
    selectElement(hit.object.userData.el);
  }
});

function selectElement(el){
  if(selectedMesh) selectedMesh.userData.selected = false;
  selectedMesh = el.mesh;
  selectedMesh.userData.selected = true;
  openPanel(el);
  lastInteraction = Date.now();
}

/* =========================================================================
   ANIMATION LOOP
   ========================================================================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if(autoRotate && Date.now()-lastInteraction > 2200){
    targetTheta += 0.0016;
  }
  theta += (targetTheta-theta)*0.08;
  phi += (targetPhi-phi)*0.08;
  radius += (targetRadius-radius)*0.08;
  updateCamera();

  tileGroup.children.forEach(mesh=>{
    if(!mesh.userData.el) return;
    const ud = mesh.userData;
    let targetZ = 0, targetScale = 1, targetEmissive = 0.08;
    if(ud.selected){ targetZ = 0.55; targetScale = 1.12; targetEmissive = 0.55; }
    else if(ud.hovered){ targetZ = 0.32; targetScale = 1.08; targetEmissive = 0.32; }
    mesh.position.z += (targetZ - mesh.position.z) * 0.18;
    mesh.scale.x += (targetScale - mesh.scale.x) * 0.18;
    mesh.scale.y += (targetScale - mesh.scale.y) * 0.18;
    const fm = mesh.material[4];
    fm.emissiveIntensity += (targetEmissive - fm.emissiveIntensity) * 0.18;

    // idle shimmer
    if(!ud.hovered && !ud.selected){
      mesh.position.z += Math.sin(t*0.6 + mesh.position.x*2 + mesh.position.y*2) * 0.0025;
    }

    // filter dimming
    const dim = ud.dimmed;
    const targetOpacity = dim ? 0.12 : 1;
    for(let i=0;i<mesh.material.length;i++){
      const m = mesh.material[i];
      if(m.opacity === undefined) m.opacity = 1;
      m.transparent = true;
      m.opacity += (targetOpacity - m.opacity) * 0.15;
    }
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

/* =========================================================================
   UI: legend / filters / search
   ========================================================================= */
const legendEl = document.getElementById('legend');
let activeFilters = new Set();
Object.keys(CATS).forEach(key=>{
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.style.color = CATS[key].color;
  chip.innerHTML = '<span class="dot" style="background:'+CATS[key].color+'"></span>' + CATS[key].label;
  chip.addEventListener('click', ()=>{
    if(activeFilters.has(key)){ activeFilters.delete(key); chip.classList.remove('active'); }
    else { activeFilters.add(key); chip.classList.add('active'); }
    applyFilters();
  });
  legendEl.appendChild(chip);
});
function clearFilters(){
  activeFilters.clear();
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  document.getElementById('search').value='';
  applyFilters();
}
function applyFilters(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  RAW.forEach(el=>{
    let visible = true;
    if(activeFilters.size>0 && !activeFilters.has(el.cat)) visible = false;
    if(q && !(el.name.toLowerCase().includes(q) || el.sym.toLowerCase().includes(q) || String(el.z)===q)) visible = false;
    el.mesh.userData.dimmed = !visible;
    if(visible) shown++;
  });
  document.getElementById('count-num').textContent = shown;
}
document.getElementById('search').addEventListener('input', applyFilters);

/* =========================================================================
   DETAIL PANEL
   ========================================================================= */
const panel = document.getElementById('detail-panel');
function openPanel(el){
  const cat = CATS[el.cat] || {label:'Unknown', color:'#8b96a5'};
  document.documentElement.style.setProperty('--cat-color-live', cat.color);
  document.getElementById('panel-hero').style.setProperty('--cat-color', cat.color);
  document.getElementById('p-num').textContent = 'ELEMENT ' + el.z;
  document.getElementById('p-symbol').textContent = el.sym;
  document.getElementById('p-name').textContent = el.name;
  document.getElementById('p-mass').textContent = 'Atomic mass ' + el.mass + ' u';
  document.getElementById('p-badge').textContent = cat.label;

  const stats = [
    ['Phase (STP)', el.phase],
    ['Period / Group', el.period<=7 ? (el.period+' / '+el.group) : (el.cat==='lanthanide'?'6 / f-block':'7 / f-block')],
    ['Discovered', el.year>0 ? el.year : (el.year===-1 ? 'Antiquity' : '—')],
    ['Discoverer', el.disc || '—'],
    ['Melting point', el.melt!==null ? el.melt+' °C' : 'Unknown'],
    ['Boiling point', el.boil!==null ? el.boil+' °C' : 'Unknown'],
    ['Density', el.dens!==null ? el.dens+' g/cm³' : 'Unknown'],
    ['Electronegativity', el.en!==null ? el.en+' (Pauling)' : 'N/A'],
  ];
  const grid = document.getElementById('p-stats');
  grid.innerHTML = '';
  stats.forEach(([label,value])=>{
    const d = document.createElement('div');
    d.className='stat';
    d.innerHTML = '<div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div>';
    grid.appendChild(d);
  });

  document.getElementById('p-config').textContent = el.config;
  document.getElementById('p-desc').textContent = el.info;
  document.getElementById('p-uses').textContent = el.uses;

  panel.classList.add('open');
}
function closePanel(){
  panel.classList.remove('open');
  if(selectedMesh){ selectedMesh.userData.selected = false; selectedMesh = null; }
}
document.getElementById('panel-close').addEventListener('click', closePanel);

// hint fade after a while
setTimeout(()=>{ document.getElementById('hint').style.opacity = '0.35'; }, 6000);
</script>
</body>
