<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euler's Identity Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #title-container {
            text-align: center;
            margin-top: 20px;
            height: 120px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            color: #4facfe;
            font-weight: 400;
            letter-spacing: 2px;
        }

        #equation {
            font-size: 3rem;
            margin: 10px 0 0 0;
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
            opacity: 0;
        }

        canvas {
            background-color: #111827;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            opacity: 0;
        }

        #controls {
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="title-container">
            <h1 id="main-title">Euler's Identity</h1>
            <div id="equation">e<sup>iπ</sup> + 1 = 0</div>
        </div>

        <canvas id="eulerCanvas" width="600" height="400"></canvas>

        <div id="controls">
            <button id="playBtn">Run Animation</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('eulerCanvas');
        const ctx = canvas.getContext('2d');
        
        // Configuration state for GSAP tracking
        const center = { x: canvas.width / 2, y: canvas.height / 2 + 20 };
        const radius = 120;
        
        // Animation variables mutated by GSAP
        let animState = {
            angle: 0,          // Rotates from 0 to PI
            planeOpacity: 0,   // Fades grid elements in
            circleOpacity: 0,  // Fades unit circle in
            finalOverlay: 0    // Controls the final transition
        };

        // Draw Loop
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw Grid Lines (Complex Plane)
            ctx.globalAlpha = animState.planeOpacity;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            
            // Grid Axis lines
            ctx.beginPath();
            ctx.moveTo(0, center.y); ctx.lineTo(canvas.width, center.y);
            ctx.moveTo(center.x, 0); ctx.lineTo(center.x, canvas.height);
            ctx.stroke();

            // Label axes
            ctx.fillStyle = '#64748b';
            ctx.font = '14px sans-serif';
            ctx.fillText('Re', canvas.width - 25, center.y - 10);
            ctx.fillText('Im', center.x + 10, 25);
            
            // Core coordinate points (1, -1, i, -i)
            ctx.fillText('1', center.x + radius - 5, center.y + 20);
            ctx.fillText('-1', center.x - radius - 8, center.y + 20);
            ctx.fillText('i', center.x + 10, center.y - radius + 5);
            ctx.fillText('-i', center.x + 10, center.y + radius + 5);

            // 2. Draw Unit Circle
            ctx.globalAlpha = animState.circleOpacity;
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]); // Clean looking dashes
            ctx.beginPath();
            ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]); // Reset dash

            // 3. Draw Red Traced Arc Path (\pi tracking)
            if(animState.angle > 0) {
                ctx.globalAlpha = 1;
                ctx.strokeStyle = '#f43f5e';
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Notice negative angle because HTML canvas inverted Y-axis
                ctx.arc(center.x, center.y, radius, 0, -animState.angle, true);
                ctx.stroke();
            }

            // 4. Draw Rotating Vector (The Arrow)
            if(animState.planeOpacity > 0.5) {
                ctx.globalAlpha = 1 - animState.finalOverlay;
                const targetX = center.x + radius * Math.cos(-animState.angle);
                const targetY = center.y + radius * Math.sin(-animState.angle);
                
                // Vector line
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(targetX, targetY);
                ctx.stroke();

                // Dynamic vector head tracking endpoint
                ctx.fillStyle = '#ec4899';
                ctx.beginPath();
                ctx.arc(targetX, targetY, 6, 0, Math.PI * 2);
                ctx.fill();

                // Live dynamic math label text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'italic 16px Georgia';
                if(animState.angle < Math.PI * 0.9) {
                    ctx.fillText('e^iθ', targetX + 10, targetY - 10);
                } else {
                    ctx.fillStyle = '#ec4899';
                    ctx.fillText('e^iπ = -1', targetX - 75, targetY - 15);
                }
            }

            requestAnimationFrame(draw);
        }

        // Trigger Master Timeline Sequence
        document.getElementById('playBtn').addEventListener('click', () => {
            // Reset to clean states
            animState = { angle: 0, planeOpacity: 0, circleOpacity: 0, finalOverlay: 0 };
            document.getElementById('playBtn').style.pointerEvents = 'none';

            let tl = gsap.timeline({
                onUpdate: draw,
                onComplete: () => {
                    document.getElementById('playBtn').style.pointerEvents = 'auto';
                }
            });

            // Timed Sequences matching image breakdown
            tl.to('#equation', { opacity: 1, y: 0, duration: 1 })
              .to('canvas', { opacity: 1, duration: 0.5 }, "-=0.5")
              .to(animState, { planeOpacity: 1, duration: 0.8 })
              .to(animState, { circleOpacity: 1, duration: 0.8 })
              // Rotate around to reach PI rad (180 deg)
              .to(animState, { angle: Math.PI, duration: 3, ease: "power1.inOut" }, "+=0.5")
              // Fade visual assets out to draw focus back to algebraic statement
              .to(animState, { finalOverlay: 1, duration: 0.8 }, "+=1")
              .to('canvas', { opacity: 0, height: 0, margin: 0, duration: 0.8 }, "-=0.8")
              .to('#main-title', { scale: 0.8, color: '#64748b', duration: 0.5 }, "-=0.4")
              .to('#equation', { scale: 1.4, color: '#fbbf24', duration: 0.8, ease: "back.out(2)" });
        });

        // Initialize frame
        draw();
    </script>
</body>
</html>
