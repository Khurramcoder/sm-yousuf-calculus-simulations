<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebGL 3D Tensor Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e1117; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 12px; border-radius: 6px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="info">
    <b>WebGL Tensor Visualizer (Rank 3)</b><br/>
    Shape: [8, 8, 8] | Rendered via InstancedMesh
  </div>

  <script>
    // 1. Setup WebGL Scene, Camera, and Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 12, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // 2. Define Tensor Dimensions (Rank 3: [Depth, Height, Width])
    const [D, H, W] = [8, 8, 8];
    const totalElements = D * H * W;

    // 3. Create Instanced Mesh for Tensor Cells
    const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
    const material = new THREE.MeshPhongMaterial({
      transparent: true,
      opacity: 0.85
    });
    const instancedMesh = new THREE.InstancedMesh(geometry, material, totalElements);

    // 4. Fill WebGL Instance Matrices & Colors from Tensor Data
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();
    let index = 0;

    for (let d = 0; d < D; d++) {
      for (let h = 0; h < H; h++) {
        for (let w = 0; w < W; w++) {
          // Map tensor indices (d, h, w) to 3D spatial coordinates
          const posX = w - (W - 1) / 2;
          const posY = h - (H - 1) / 2;
          const posZ = d - (D - 1) / 2;

          dummy.position.set(posX, posY, posZ);
          dummy.updateMatrix();
          instancedMesh.setMatrixAt(index, dummy.matrix);

          // Value-based coloring (e.g., scalar magnitude mapped to Hue)
          const value = (d + h + w) / (D + H + W - 3); // Normalized tensor value [0, 1]
          color.setHSL(0.66 - value * 0.66, 1.0, 0.5); // Blue (low) to Red (high)
          instancedMesh.setColorAt(index, color);

          index++;
        }
      }
    }

    scene.add(instancedMesh);

    // 5. Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // 6. Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      instancedMesh.rotation.y += 0.005; // Smooth rotation
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
