<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycloid Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0.9;
            font-size: 1.1em;
        }

        canvas {
            display: block;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin: 0 auto 30px;
            cursor: crosshair;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95em;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .value-display {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.95em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Cycloid Motion</h1>
        <p class="subtitle">Watch a point on a rolling circle trace a beautiful curve</p>
        
        <canvas id="canvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <div class="control-group">
                <label>
                    Circle Radius: <span class="value-display" id="radiusValue">40</span>
                </label>
                <input type="range" id="radius" min="20" max="80" value="40">
            </div>
            
            <div class="control-group">
                <label>
                    Speed: <span class="value-display" id="speedValue">1.0x</span>
                </label>
                <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
            </div>
            
            <div class="control-group">
                <label>
                    Trail Length: <span class="value-display" id="trailValue">500</span>
                </label>
                <input type="range" id="trail" min="50" max="1000" step="50" value="500">
            </div>
        </div>
        
        <div class="buttons">
            <button id="playPause">⏸️ Pause</button>
            <button id="reset">🔄 Reset</button>
            <button id="clear">🧹 Clear Trail</button>
        </div>
        
        <div class="info">
            <strong>What is a Cycloid?</strong><br>
            A cycloid is the curve traced by a point on the rim of a circular wheel as it rolls along a straight line. This fascinating curve appears in physics, engineering, and mathematics!
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let radius = 40;
        let angle = 0;
        let speed = 0.02;
        let isPlaying = true;
        let trailPoints = [];
        let maxTrailLength = 500;
        
        const radiusSlider = document.getElementById('radius');
        const speedSlider = document.getElementById('speed');
        const trailSlider = document.getElementById('trail');
        const playPauseBtn = document.getElementById('playPause');
        const resetBtn = document.getElementById('reset');
        const clearBtn = document.getElementById('clear');
        
        // Update value displays
        radiusSlider.addEventListener('input', (e) => {
            radius = parseInt(e.target.value);
            document.getElementById('radiusValue').textContent = radius;
        });
        
        speedSlider.addEventListener('input', (e) => {
            speed = parseFloat(e.target.value) * 0.02;
            document.getElementById('speedValue').textContent = parseFloat(e.target.value).toFixed(1) + 'x';
        });
        
        trailSlider.addEventListener('input', (e) => {
            maxTrailLength = parseInt(e.target.value);
            document.getElementById('trailValue').textContent = maxTrailLength;
        });
        
        // Button controls
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            playPauseBtn.textContent = isPlaying ? '⏸️ Pause' : '▶️ Play';
        });
        
        resetBtn.addEventListener('click', () => {
            angle = 0;
            trailPoints = [];
        });
        
        clearBtn.addEventListener('click', () => {
            trailPoints = [];
        });
        
        function drawCycloid() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw ground line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 100);
            ctx.lineTo(canvas.width, canvas.height - 100);
            ctx.stroke();
            
            // Calculate positions
            const groundY = canvas.height - 100;
            const centerX = 100 + angle * radius;
            const centerY = groundY - radius;
            
            // Calculate point on circle
            const pointX = centerX - radius * Math.sin(angle);
            const pointY = centerY + radius * Math.cos(angle);
            
            // Add to trail
            trailPoints.push({ x: pointX, y: pointY });
            if (trailPoints.length > maxTrailLength) {
                trailPoints.shift();
            }
            
            // Draw trail with gradient
            if (trailPoints.length > 1) {
                for (let i = 1; i < trailPoints.length; i++) {
                    const alpha = i / trailPoints.length;
                    ctx.strokeStyle = `rgba(255, 100, 150, ${alpha})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(trailPoints[i - 1].x, trailPoints[i - 1].y);
                    ctx.lineTo(trailPoints[i].x, trailPoints[i].y);
                    ctx.stroke();
                }
            }
            
            // Draw circle
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // Draw line from center to point
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.lineTo(pointX, pointY);
            ctx.stroke();
            
            // Draw center point
            ctx.fillStyle = '#4a5568';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw tracing point
            ctx.fillStyle = '#ff6496';
            ctx.beginPath();
            ctx.arc(pointX, pointY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw glow effect
            ctx.fillStyle = 'rgba(255, 100, 150, 0.3)';
            ctx.beginPath();
            ctx.arc(pointX, pointY, 12, 0, Math.PI * 2);
            ctx.fill();
            
            // Update angle
            if (isPlaying) {
                angle += speed;
                
                // Reset if circle goes off screen
                if (centerX > canvas.width + radius) {
                    angle = 0;
                    trailPoints = [];
                }
            }
        }
        
        function animate() {
            drawCycloid();
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
