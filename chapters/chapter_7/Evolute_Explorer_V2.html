<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolute Explorer V2</title>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh}
.sidebar{background:#111827;padding:16px;overflow:auto}
.main{position:relative}
.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:12px}
select,button,input{width:100%;margin:6px 0}
button{padding:10px;border:none;border-radius:8px}
svg{width:100%;height:100%}
.info{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);padding:12px;border-radius:10px;width:300px}
</style>
</head>
<body>
<div id="app">
<div class="sidebar">
<h2>Evolute Explorer V2</h2>

<div class="card">
<label>Curve</label>
<select id="curve">
<option value="parabola">Parabola</option>
<option value="circle">Circle</option>
<option value="ellipse">Ellipse</option>
</select>
<button id="play">Play / Pause</button>
<button id="reset">Reset</button>
<input id="slider" type="range" min="0" max="100" value="0">
</div>

<div class="card">
<h3>Lecture Mode</h3>
<button id="prev">Previous Step</button>
<button id="next">Next Step</button>
<div id="lecture"></div>
</div>

<div class="card">
$$\kappa=\frac{|x'y''-y'x''|}{(x'^2+y'^2)^{3/2}}$$
</div>
</div>

<div class="main">
<svg id="svg"></svg>
<div class="info" id="info"></div>
</div>
</div>

<script>
const svg=document.getElementById("svg");
let w,h,param=0,playing=false,evolute=[];

const lessons=[
"Curve Geometry",
"Tangent Vector",
"Normal Vector",
"Curvature",
"Radius of Curvature",
"Center of Curvature",
"Evolute"
];
let lesson=0;

const curves={
parabola:{
min:-8,max:8,
x:t=>t,y:t=>t*t/8,
dx:t=>1,dy:t=>t/4,
ddx:t=>0,ddy:t=>0.25},
circle:{
min:0,max:Math.PI*2,
x:t=>5*Math.cos(t),y:t=>5*Math.sin(t),
dx:t=>-5*Math.sin(t),dy:t=>5*Math.cos(t),
ddx:t=>-5*Math.cos(t),ddy:t=>-5*Math.sin(t)},
ellipse:{
min:0,max:Math.PI*2,
x:t=>7*Math.cos(t),y:t=>4*Math.sin(t),
dx:t=>-7*Math.sin(t),dy:t=>4*Math.cos(t),
ddx:t=>-7*Math.cos(t),ddy:t=>-4*Math.sin(t)}
};
let current="parabola";

function updateLecture(){document.getElementById("lecture").innerHTML="<b>"+lessons[lesson]+"</b>";}
updateLecture();

function S(x,y){return {x:w/2+x*35,y:h/2-y*35};}
function curve(){return curves[current]}
function tval(){let c=curve(); return c.min+(c.max-c.min)*param;}

function curvature(){
 let c=curve(),t=tval();
 let dx=c.dx(t),dy=c.dy(t),ddx=c.ddx(t),ddy=c.ddy(t);
 return Math.abs(dx*ddy-dy*ddx)/Math.pow(dx*dx+dy*dy,1.5);
}
function rho(){return 1/curvature();}

function center(){
 let c=curve(),t=tval();
 let x=c.x(t),y=c.y(t),dx=c.dx(t),dy=c.dy(t);
 let s=Math.sqrt(dx*dx+dy*dy),r=rho();
 return {x:x-r*(dy/s),y:y+r*(dx/s)};
}

function add(tag,attrs){
 let e=document.createElementNS("http://www.w3.org/2000/svg",tag);
 Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
 svg.appendChild(e); return e;
}

function render(){
 svg.innerHTML=""; w=svg.clientWidth; h=svg.clientHeight;

 for(let x=0;x<w;x+=40) add("line",{x1:x,y1:0,x2:x,y2:h,stroke:"#1e293b"});
 for(let y=0;y<h;y+=40) add("line",{x1:0,y1:y,x2:w,y2:y,stroke:"#1e293b"});

 let c=curve(), d="";
 for(let i=0;i<=500;i++){
  let t=c.min+(c.max-c.min)*i/500;
  let p=S(c.x(t),c.y(t));
  d+=(i?" L ":"M ")+p.x+" "+p.y;
 }
 add("path",{d,fill:"none",stroke:"#22c55e","stroke-width":4});

 let t=tval(),x=c.x(t),y=c.y(t),dx=c.dx(t),dy=c.dy(t);
 let p=S(x,y);

 add("line",{x1:p.x-dx*40,y1:p.y+dy*40,x2:p.x+dx*40,y2:p.y-dy*40,stroke:"#38bdf8","stroke-width":3});
 add("line",{x1:p.x+dy*40,y1:p.y+dx*40,x2:p.x-dy*40,y2:p.y-dx*40,stroke:"#f59e0b","stroke-width":3});

 let cc=center(),cp=S(cc.x,cc.y);
 add("line",{x1:p.x,y1:p.y,x2:cp.x,y2:cp.y,stroke:"#ef4444"});
 add("circle",{cx:p.x,cy:p.y,r:6,fill:"white"});
 add("circle",{cx:cp.x,cy:cp.y,r:5,fill:"#ef4444"});
 add("circle",{cx:cp.x,cy:cp.y,r:rho()*35,fill:"none",stroke:"#f59e0b"});

 let evo=evolute.map(v=>S(v.x,v.y));
 if(evo.length>1){
  let ed="M "+evo[0].x+" "+evo[0].y;
  for(let i=1;i<evo.length;i++) ed+=" L "+evo[i].x+" "+evo[i].y;
  add("path",{d:ed,fill:"none",stroke:"#ef4444","stroke-width":4});
 }

 document.getElementById("info").innerHTML=`
 Curve: ${current}<br>
 κ = ${curvature().toFixed(5)}<br>
 ρ = ${rho().toFixed(3)}<br>
 Evolute points = ${evolute.length}
 `;
}

document.getElementById("curve").onchange=e=>{current=e.target.value;evolute=[];render();};
document.getElementById("slider").oninput=e=>{param=e.target.value/100;render();};
document.getElementById("play").onclick=()=>playing=!playing;
document.getElementById("reset").onclick=()=>{evolute=[];param=0;render();};
document.getElementById("next").onclick=()=>{lesson=Math.min(lessons.length-1,lesson+1);updateLecture();};
document.getElementById("prev").onclick=()=>{lesson=Math.max(0,lesson-1);updateLecture();};

function anim(){
 if(playing){
   param+=0.002;
   if(param>1){param=0;evolute=[];}
   evolute.push(center());
   document.getElementById("slider").value=param*100;
   render();
 }
 requestAnimationFrame(anim);
}
window.onresize=render;
render();anim();
</script>
</body>
</html>
