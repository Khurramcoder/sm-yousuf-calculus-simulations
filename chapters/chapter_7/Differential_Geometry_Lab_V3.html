<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Differential Geometry Lab V3</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh}
.sidebar{background:#111827;padding:16px;overflow:auto}
.card{background:#1e293b;padding:12px;border-radius:12px;margin-bottom:12px}
svg{width:100%;height:100%}
button,select,input{width:100%;margin:5px 0;padding:8px}
.main{position:relative}
.info{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.8);padding:12px;border-radius:10px;width:320px}
</style>
</head>
<body>
<div id="app">
<div class="sidebar">
<h2>Geometry Lab V3</h2>

<div class="card">
<label>Module</label>
<select id="module">
<option value="evolute">Evolute Explorer</option>
<option value="envelope">Envelope Explorer</option>
</select>
</div>

<div class="card">
<label>Curve / Family</label>
<select id="selector">
<option value="parabola">Parabola</option>
<option value="circle">Circle</option>
<option value="ellipse">Ellipse</option>
</select>
<button id="play">Play / Pause</button>
<button id="reset">Reset</button>
<input id="slider" type="range" min="0" max="100" value="0">
</div>

<div class="card" id="theory">
Interactive theory panel
</div>
</div>

<div class="main">
<svg id="svg"></svg>
<div class="info" id="info"></div>
</div>
</div>

<script>
const svg=document.getElementById("svg");
let w,h,param=0,playing=false,moduleType="evolute";
let evolute=[];

const curves={
parabola:{min:-8,max:8,x:t=>t,y:t=>t*t/8,dx:t=>1,dy:t=>t/4,ddx:t=>0,ddy:t=>0.25},
circle:{min:0,max:2*Math.PI,x:t=>5*Math.cos(t),y:t=>5*Math.sin(t),dx:t=>-5*Math.sin(t),dy:t=>5*Math.cos(t),ddx:t=>-5*Math.cos(t),ddy:t=>-5*Math.sin(t)},
ellipse:{min:0,max:2*Math.PI,x:t=>7*Math.cos(t),y:t=>4*Math.sin(t),dx:t=>-7*Math.sin(t),dy:t=>4*Math.cos(t),ddx:t=>-7*Math.cos(t),ddy:t=>-4*Math.sin(t)}
};
let current="parabola";

function S(x,y){return{x:w/2+x*35,y:h/2-y*35};}
function add(tag,a){let e=document.createElementNS("http://www.w3.org/2000/svg",tag);for(let k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
function curve(){return curves[current]}
function tval(){let c=curve();return c.min+(c.max-c.min)*param;}

function curvature(){
 let c=curve(),t=tval();
 let dx=c.dx(t),dy=c.dy(t),ddx=c.ddx(t),ddy=c.ddy(t);
 return Math.abs(dx*ddy-dy*ddx)/Math.pow(dx*dx+dy*dy,1.5);
}
function rho(){return 1/curvature();}
function center(){
 let c=curve(),t=tval();
 let x=c.x(t),y=c.y(t),dx=c.dx(t),dy=c.dy(t);
 let s=Math.sqrt(dx*dx+dy*dy),r=rho();
 return {x:x-r*(dy/s),y:y+r*(dx/s)};
}

function drawGrid(){
 for(let x=0;x<w;x+=40)add("line",{x1:x,y1:0,x2:x,y2:h,stroke:"#1e293b"});
 for(let y=0;y<h;y+=40)add("line",{x1:0,y1:y,x2:w,y2:y,stroke:"#1e293b"});
}

function renderEvolute(){
 let c=curve(),d="";
 for(let i=0;i<=500;i++){
  let t=c.min+(c.max-c.min)*i/500,p=S(c.x(t),c.y(t));
  d+=(i?" L ":"M ")+p.x+" "+p.y;
 }
 add("path",{d:d,fill:"none",stroke:"#22c55e","stroke-width":4});

 let t=tval(),x=c.x(t),y=c.y(t),dx=c.dx(t),dy=c.dy(t),p=S(x,y);
 add("line",{x1:p.x-dx*40,y1:p.y+dy*40,x2:p.x+dx*40,y2:p.y-dy*40,stroke:"#38bdf8","stroke-width":3});
 add("line",{x1:p.x+dy*40,y1:p.y+dx*40,x2:p.x-dy*40,y2:p.y-dx*40,stroke:"#f59e0b","stroke-width":3});

 let cc=center(),cp=S(cc.x,cc.y);
 add("line",{x1:p.x,y1:p.y,x2:cp.x,y2:cp.y,stroke:"#ef4444"});
 add("circle",{cx:p.x,cy:p.y,r:6,fill:"white"});
 add("circle",{cx:cp.x,cy:cp.y,r:5,fill:"#ef4444"});
 add("circle",{cx:cp.x,cy:cp.y,r:rho()*35,fill:"none",stroke:"#f59e0b"});

 if(evolute.length>1){
  let ed="M "+S(evolute[0].x,evolute[0].y).x+" "+S(evolute[0].x,evolute[0].y).y;
  for(let i=1;i<evolute.length;i++){let q=S(evolute[i].x,evolute[i].y);ed+=" L "+q.x+" "+q.y;}
  add("path",{d:ed,fill:"none",stroke:"#ef4444","stroke-width":4});
 }

 document.getElementById("theory").innerHTML="Curvature, normal lines, osculating circles and evolutes.";
 document.getElementById("info").innerHTML="κ="+curvature().toFixed(5)+"<br>ρ="+rho().toFixed(3)+"<br>Evolute points="+evolute.length;
}

function drawEnvelope(){
 document.getElementById("theory").innerHTML=
 "Family: y = mx + 1/m<br>Envelope from F=0 and ∂F/∂m=0<br>Envelope: y = ±2√x";

 for(let k=-3;k<=3;k+=0.25){
  if(Math.abs(k)<0.05) continue;
  let d="";
  for(let x=-2;x<=10;x+=0.1){
   let y=k*x+1/k,p=S(x,y);
   d+=(d?" L ":"M ")+p.x+" "+p.y;
  }
  add("path",{d,fill:"none",stroke:"#64748b","stroke-width":1});
 }

 let up="",lo="";
 for(let x=0.01;x<=10;x+=0.05){
  let y=2*Math.sqrt(x);
  let p1=S(x,y),p2=S(x,-y);
  up+=(up?" L ":"M ")+p1.x+" "+p1.y;
  lo+=(lo?" L ":"M ")+p2.x+" "+p2.y;
 }
 add("path",{d:up,fill:"none",stroke:"#ef4444","stroke-width":4});
 add("path",{d:lo,fill:"none",stroke:"#ef4444","stroke-width":4});

 let m=-3+6*param;
 if(Math.abs(m)>0.05){
   let x=1/(m*m), y=2/m, p=S(x,y);
   add("circle",{cx:p.x,cy:p.y,r:7,fill:"white"});
   document.getElementById("info").innerHTML="Parameter m="+m.toFixed(2)+"<br>Tangency point on envelope";
 }
}

function render(){
 svg.innerHTML="";
 w=svg.clientWidth; h=svg.clientHeight;
 drawGrid();
 if(moduleType==="evolute") renderEvolute(); else drawEnvelope();
}

document.getElementById("module").onchange=e=>{
 moduleType=e.target.value;
 document.getElementById("selector").innerHTML =
 moduleType==="evolute"
 ? '<option value="parabola">Parabola</option><option value="circle">Circle</option><option value="ellipse">Ellipse</option>'
 : '<option value="linefamily">Line Family</option>';
 render();
};

document.getElementById("selector").onchange=e=>{current=e.target.value; evolute=[]; render();};
document.getElementById("slider").oninput=e=>{param=e.target.value/100; render();};
document.getElementById("play").onclick=()=>playing=!playing;
document.getElementById("reset").onclick=()=>{param=0;evolute=[];render();};

function animate(){
 if(playing){
   param+=0.002;
   if(param>1) param=0;
   if(moduleType==="evolute") evolute.push(center());
   document.getElementById("slider").value=param*100;
   render();
 }
 requestAnimationFrame(animate);
}
window.onresize=render;
render();
animate();
</script>
</body>
</html>
