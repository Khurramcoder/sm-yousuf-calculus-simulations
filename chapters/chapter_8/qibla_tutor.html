<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spherical Trigonometry Laboratory</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background-color: #0b1329; 
            color: #f8fafc; 
            font-family: system-ui, sans-serif; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
        }
        .sidebar { 
            width: 45%; 
            border-right: 1px solid #1e293b; 
            background: #0f172a; 
            display: flex; 
            flex-direction: column; 
        }
        .controls { 
            padding: 15px; 
            background: #1e293b; 
            display: flex;
            gap: 12px; 
            border-bottom: 1px solid #334155; 
        }
        .control-group { 
            display: flex; 
            flex-direction: column;
            flex: 1;
        }
        label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #94a3b8; 
            font-weight: bold; 
            margin-bottom: 6px; 
        }
        input, select { 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 8px; 
            color: #38bdf8; 
            font-family: monospace; 
            border-radius: 4px; 
            font-size: 13px;
            width: 100%;
        }
        .content { 
            flex: 1; 
            padding: 25px; 
            overflow-y: auto; 
        }
        .nav-footer { 
            padding: 15px; 
            background: #0f172a; 
            border-top: 1px solid #1e293b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        button { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
        }
        button:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
        }
        .visual-panel { 
            width: 55%; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            background: #020617; 
            cursor: grab;
        }
        .visual-panel:active { cursor: grabbing; }
        canvas { 
            flex: 1; 
            width: 100%; 
            height: 100%; 
        }
        .caption { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            right: 20px; 
            background: rgba(15, 23, 42, 0.95); 
            border: 1px solid #1e293b; 
            padding: 14px; 
            border-radius: 8px; 
            pointer-events: none; 
        }
        .step-title { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-bottom: 1px solid #1e293b; 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
        }
        .step-title h2 { margin: 0; font-size: 18px; }
        .formula-box { 
            background: #020617; 
            border: 1px solid #1e293b; 
            padding: 12px; 
            font-family: monospace; 
            font-size: 12px; 
            border-radius: 6px; 
            color: #cbd5e1; 
            margin: 15px 0; 
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="controls">
            <div class="control-group">
                <label>Preset Target</label>
                <select id="presetLoc">
                    <option value="31.52,74.36">Lahore (Example 41)</option>
                    <option value="23.70,90.37">Dhaka (Example 42)</option>
                    <option value="40.71,-74.00">New York</option>
                </select>
            </div>
            <div class="control-group" style="max-width: 90px;">
                <label>Lat (φ)</label>
                <input type="number" id="latIn" value="31.52" step="0.01">
            </div>
            <div class="control-group" style="max-width: 90px;">
                <label>Lon (λ)</label>
                <input type="number" id="lonIn" value="74.36" step="0.01">
            </div>
        </div>

        <div id="stepContentBox" class="content"></div>

        <div class="nav-footer">
            <button id="btnPrev">&larr; Previous</button>
            <div style="font-size: 13px; color: #94a3b8;">Step <span id="stepCounter" style="color:#0284c7; font-weight:bold;">1</span> of 4</div>
            <button id="btnNext">Next &rarr;</button>
        </div>
    </div>

    <div class="visual-panel" id="canvasContainer">
        <canvas id="orthoCanvas"></canvas>
        <div class="caption">
            <span style="color: #f59e0b; font-size: 10px; font-weight: bold; text-transform: uppercase;">360° Real Earth Map Layer (Drag to spin in any direction)</span>
            <div id="visualInstruction" style="font-size: 13px; color: #cbd5e1; margin-top: 4px;">Initializing localized matrix elements...</div>
        </div>
    </div>

    <script>
        const K_LAT = 21.42;
        const K_LON = 39.82;
        let currentStep = 1;
        let appData = { lat: 31.52, lon: 74.36 };

        // 3D Rotation State Parameters
        let rotationX = -0.4;
        let rotationY = -0.8;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        const canvas = document.getElementById('orthoCanvas');
        const ctx = canvas.getContext('2d');

        // Low-poly procedural map dataset approximating real continents completely offline
        const continents = [
            // Africa & Europe
            [[35, -10], [35, 30], [30, 35], [10, 45], [-5, 40], [-34, 20], [-15, 12], [5, 10], [15, -15], [35, -10]],
            // Eurasia
            [[35, 30], [70, 30], [75, 60], [70, 100], [60, 130], [60, 170], [40, 140], [20, 120], [10, 105], [25, 80], [12, 45], [25, 35], [35, 30]],
            // North America
            [[25, -100], [15, -90], [8, -80], [25, -80], [25, -75], [45, -60], [55, -55], [70, -70], [70, -160], [60, -165], [50, -125], [30, -115], [25, -100]],
            // South America
            [[8, -80], [10, -60], [-5, -35], [-50, -65], [-55, -70], [-40, -75], [-20, -70], [0, -80], [8, -80]],
            // Australia
            [[-20, 115], [-12, 130], [-10, 142], [-25, 153], [-38, 145], [-35, 115], [-20, 115]]
        ];

        const stepsTemplate = [
            {
                title: "1. Defining the Spherical Triangle (ΔNPK)",
                vis: "Plotting spatial nodes: North Pole (N), Local User Coordinates (P), and Makkah Destination Reference (K).",
                render: (d) => `
                    <p style="font-size:14px; color:#94a3b8; line-height:1.5;">To calculate the geographical bearing over a curved Earth surface model, standard linear trigonometry is replaced by <strong>Spherical Trigonometry</strong> using great circle trajectories.</p>
                    <div class="formula-box">
                        Vertex N: True North Pole (90° Latitude)<br>
                        Vertex P: Local Coordinate Frame (${d.lat}°N, ${d.lon}°E)<br>
                        Vertex K: Destination Target (21.42°N, 39.82°E)
                    </div>
                    <p style="font-size:13px; color:#64748b; line-height: 1.4;">Side c (Colatitude of P) = 90° - φ = <span style="color:#38bdf8; font-family: monospace;">${(90 - d.lat).toFixed(1)}°</span><br>Side b (Colatitude of K) = 90° - φ₀ = <span style="color:#34d399; font-family: monospace;">68.6°</span></p>`
            },
            {
                title: "2. Longitudinal Separation Angle (l)",
                vis: "Isolating the localized longitudinal separation gap wedge open along the polar coordinate boundary.",
                render: (d) => {
                    const l = Math.abs(d.lon - K_LON);
                    return `
                    <p style="font-size:14px; color:#94a3b8; line-height:1.5;">Angle l is the interior angle located directly at the North Pole apex, measuring total East-West divergence between the two longitudes.</p>
                    <div class="formula-box" style="text-align:center; font-size:14px; color:#f59e0b;">
                        l = | λ_local - λ_destination |<br>
                        <span style="color:#fff; font-size:13px;">l = | ${d.lon}° - ${K_LON}° | = ${l.toFixed(2)}°</span>
                    </div>`;
                }
            },
            {
                title: "3. Computing the Cotangent Ratio Matrix",
                vis: "Highlighting the interlocking mathematical formulas running calculations across the geometry triangle frame.",
                render: (d) => {
                    const p0 = K_LAT * Math.PI / 180;
                    const p = d.lat * Math.PI / 180;
                    const l = Math.abs(d.lon - K_LON) * Math.PI / 180;
                    const num = Math.sin(p) * Math.cos(l) - Math.cos(p) * Math.tan(p0);
                    const cotP = num / Math.sin(l);
                    return `
                    <p style="font-size:14px; color:#94a3b8; line-height:1.5;">We calculate the ratio utilizing the standard spherical cotangent four-parts law shown on the textbook page:</p>
                    <div class="formula-box" style="font-size:12px;">
                        cot P = (sin φ cos l - cos φ tan φ₀) / sin l<br>
                        cot P = <span style="color:#38bdf8; font-weight: bold;">${cotP.toFixed(5)}</span>
                    </div>`;
                }
            },
            {
                title: "4. Resolving the Geographic Heading (Angle P)",
                vis: "The true shortest flight path trajectory line (bright orange) drawn across the orthographic 3D projection view.",
                render: (d) => {
                    const p0 = K_LAT * Math.PI / 180;
                    const p = d.lat * Math.PI / 180;
                    const dl = (d.lon - K_LON) * Math.PI / 180;
                    let b = Math.atan2(-Math.sin(dl), Math.sin(p)*Math.cos(dl) - Math.cos(p)*Math.tan(p0)) * 180 / Math.PI;
                    b = (b + 360) % 360;
                    return `
                    <p style="font-size:14px; color:#94a3b8; line-height:1.5;">Inverting the final trigonometric value establishes the true compass direction path from your specific coordinate space.</p>
                    <div class="formula-box" style="text-align:center; background:#064e3b; border-color:#059669;">
                        <span style="font-size:11px; color:#a7f3d0; display:block; font-weight: bold;">TRUE BEARING RESULT</span>
                        <span style="font-size:22px; color:#fff; font-weight:bold;">${b.toFixed(2)}° Clockwise from North</span>
                    </div>`;
                }
            }
        ];

        // Convert Spherical Earth coordinates to 3D Cartesian points
        function to3D(lat, lon, r) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = lon * Math.PI / 180;
            return {
                x: r * Math.sin(phi) * Math.sin(theta),
                y: r * Math.cos(phi),
                z: r * Math.sin(phi) * Math.cos(theta)
            };
        }

        // Apply X and Y matrix rotations around the center axis
        function rotate3D(pt) {
            // Y-axis rotation (Longitudinal spin)
            let cosY = Math.cos(rotationY), sinY = Math.sin(rotationY);
            let x1 = pt.x * cosY - pt.z * sinY;
            let z1 = pt.x * sinY + pt.z * cosY;
            
            // X-axis rotation (Latitudinal pitch)
            let cosX = Math.cos(rotationX), sinX = Math.sin(rotationX);
            let y2 = pt.y * cosX - z1 * sinX;
            let z2 = pt.y * sinX + z1 * cosX;
            
            return { x: x1, y: y2, z: z2 };
        }

        function draw2DMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const r = Math.min(canvas.width, canvas.height) * 0.38;

            // Fill Ocean Background Sphere Area
            ctx.fillStyle = '#0c1a30';
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.fill();

            // Render 360 Degree Landmass Contours (Only draw fragments with positive Z-depth)
            ctx.fillStyle = '#1e2e4a';
            ctx.strokeStyle = '#2d446b';
            ctx.lineWidth = 1;
            continents.forEach(polygon => {
                ctx.beginPath();
                let first = true;
                polygon.forEach(coord => {
                    let p = rotate3D(to3D(coord[0], coord[1], r));
                    if (p.z >= -10) { // Keep slightly submerged coordinates to avoid abrupt clipping lines
                        if (first) { ctx.moveTo(cx + p.x, cy - p.y); first = false; }
                        else { ctx.lineTo(cx + p.x, cy - p.y); }
                    }
                });
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // Generate Full 360° Longitudinal Wire Meshes
            ctx.strokeStyle = 'rgba(56, 189, 248, 0.08)';
            ctx.lineWidth = 1;
            for (let lon = -180; lon < 180; lon += 20) {
                ctx.beginPath();
                let drawing = false;
                for (let lat = -90; lat <= 90; lat += 5) {
                    let p = rotate3D(to3D(lat, lon, r));
                    if (p.z >= 0) {
                        if (!drawing) { ctx.moveTo(cx + p.x, cy - p.y); drawing = true; }
                        else { ctx.lineTo(cx + p.x, cy - p.y); }
                    } else { drawing = false; }
                }
                ctx.stroke();
            }

            // Generate Latitudinal Parallel Ring Meshes
            for (let lat = -80; lat <= 80; lat += 20) {
                ctx.beginPath();
                let drawing = false;
                for (let lon = -180; lon <= 180; lon += 5) {
                    let p = rotate3D(to3D(lat, lon, r));
                    if (p.z >= 0) {
                        if (!drawing) { ctx.moveTo(cx + p.x, cy - p.y); drawing = true; }
                        else { ctx.lineTo(cx + p.x, cy - p.y); }
                    } else { drawing = false; }
                }
                ctx.stroke();
            }

            // Outer Atmospheric Horizon Ring
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2.5;
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.stroke();

            // Convert Vertices into rotated Space
            const n3D = rotate3D(to3D(90, 0, r));
            const p3D = rotate3D(to3D(appData.lat, appData.lon, r));
            const k3D = rotate3D(to3D(K_LAT, K_LON, r));

            // Arc Interpolator Function Layer
            function drawArc(v1Raw, v2Raw, color, width, active) {
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.globalAlpha = active ? 1.0 : 0.15;
                ctx.beginPath();
                
                let lat1 = v1Raw.lat, lon1 = v1Raw.lon;
                let lat2 = v2Raw.lat, lon2 = v2Raw.lon;
                let drawing = false;

                for (let i = 0; i <= 60; i++) {
                    let t = i / 60;
                    let currLat = lat1 + (lat2 - lat1) * t;
                    let currLon = lon1 + (lon2 - lon1) * t;
                    let p = rotate3D(to3D(currLat, currLon, r));
                    
                    if (p.z >= 0) {
                        if (!drawing) { ctx.moveTo(cx + p.x, cy - p.y); drawing = true; }
                        else { ctx.lineTo(cx + p.x, cy - p.y); }
                    } else {
                        drawing = false;
                    }
                }
                ctx.stroke();
                ctx.globalAlpha = 1.0;
            }

            // Draw Triangle Sides
            const rawN = {lat: 90, lon: 0}, rawP = {lat: appData.lat, lon: appData.lon}, rawK = {lat: K_LAT, lon: K_LON};
            drawArc(rawP, rawN, currentStep === 2 ? '#f59e0b' : '#0284c7', currentStep === 2 ? 3 : 2, currentStep >= 1);
            drawArc(rawK, rawN, currentStep === 2 ? '#f59e0b' : '#059669', currentStep === 2 ? 3 : 2, currentStep >= 1);
            drawArc(rawP, rawK, '#f97316', 3.5, currentStep === 4);

            // Node Point Plotters
            function drawNode(p3d, color, label) {
                if (p3d.z >= 0) {
                    ctx.fillStyle = color;
                    ctx.beginPath(); ctx.arc(cx + p3d.x, cy - p3d.y, 6, 0, 2*Math.PI); ctx.fill();
                    
                    ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
                    ctx.fillRect(cx + p3d.x + 8, cy - p3d.y - 10, label.length * 7 + 6, 18);
                    
                    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px monospace';
                    ctx.fillText(label, cx + p3d.x + 12, cy - p3d.y + 3);
                }
            }
            drawNode(n3D, '#ef4444', 'N (Pole)');
            drawNode(p3D, '#38bdf8', 'P (User)');
            drawNode(k3D, '#34d399', 'K (Makkah)');
        }

        // Omni-directional Trackball Drag Interfaces
        const container = document.getElementById('canvasContainer');
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            let deltaX = e.clientX - previousMousePosition.x;
            let deltaY = e.clientY - previousMousePosition.y;

            rotationY += deltaX * 0.007;
            rotationX += deltaY * 0.007;

            // Restrict X rotation to avoid passing upside down completely
            rotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, rotationX));

            previousMousePosition = { x: e.clientX, y: e.clientY };
            draw2DMap();
        });
        window.addEventListener('mouseup', () => isDragging = false);

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            draw2DMap();
        }

        function updateUI() {
            const step = stepsTemplate[currentStep - 1];
            document.getElementById('stepContentBox').innerHTML = `
                <div class="step-title"><h2>${step.title}</h2></div>
                ${step.render(appData)}`;
            document.getElementById('visualInstruction').innerText = step.vis;
            document.getElementById('stepCounter').innerText = currentStep;
            document.getElementById('btnPrev').disabled = currentStep === 1;
            document.getElementById('btnNext').innerText = currentStep === 4 ? "Restart" : "Next \u2192";
            draw2DMap();
        }

        document.getElementById('btnNext').addEventListener('click', () => {
            currentStep = currentStep < 4 ? currentStep + 1 : 1;
            updateUI();
        });
        document.getElementById('btnPrev').addEventListener('click', () => {
            if(currentStep > 1) { currentStep--; updateUI(); }
        });

        function syncInputs() {
            appData.lat = parseFloat(document.getElementById('latIn').value) || 0;
            appData.lon = parseFloat(document.getElementById('lonIn').value) || 0;
            updateUI();
        }

        document.getElementById('latIn').addEventListener('input', syncInputs);
        document.getElementById('lonIn').addEventListener('input', syncInputs);
        document.getElementById('presetLoc').addEventListener('change', (e) => {
